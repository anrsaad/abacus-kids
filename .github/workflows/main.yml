name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q AbacusKids.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug + release APKs
        run: |
          gradle -p AbacusKids assembleDebug assembleRelease --no-daemon --console=plain > build.log 2>&1 || {
            echo "=========== ERRORS ==========="
            grep -E "^e: |error:|What went wrong|Execution failed|Could not" -A4 build.log | head -80
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: AbacusKids-APKs
          path: |
            AbacusKids/app/build/outputs/apk/debug/*.apk
            AbacusKids/app/build/outputs/apk/release/*.apk
